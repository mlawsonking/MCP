name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: shared libs in sync
        run: node scripts/sync-shared.js --check
      - name: code-guard
        run: node test/local.cjs
        working-directory: code-guard
      - name: email-guard
        run: node test/local.cjs
        working-directory: email-guard
      - name: payment-guard
        run: npm install --no-audit --no-fund && node test/local.cjs
        working-directory: payment-guard
      - name: package-guard
        run: node test/local-pkg.cjs
        working-directory: package-guard
      - name: agent-firewall
        run: node test/local-firewall.cjs
        working-directory: agent-firewall
      # test/local-intel.cjs is deliberately not run here: it asserts against live third-party SSL,
      # RDAP and HTTP endpoints and fails intermittently through no fault of ours. A suite that goes
      # red at random teaches everyone to ignore red. Run it by hand when touching those endpoints.
      # Needs npm install for cheerio (api/extract.js), same as payment-guard needs js-sha3.
      - name: agent-tools-api
        run: npm install --no-audit --no-fund && node test/local.cjs && node test/local-read.cjs
        working-directory: agent-tools-api
