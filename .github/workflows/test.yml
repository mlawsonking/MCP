name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: shared libs in sync
        run: node scripts/sync-shared.js --check
      # Publishing to the MCP registry needs an interactive PAT that expires in about an hour, so a
      # publish run is scarce. Everything that can be checked without one is checked here instead.
      # A 1.1.0 run was already lost to a description being 112 characters against a 100 limit.
      - name: registry records ready to publish
        run: node scripts/check-registry-records.js
      # The core owns the detection engines and the MCP tool registry, so it runs first: if it is
      # broken, every other suite below is testing generated copies of the same break.
      # Needs npm install for @modelcontextprotocol/sdk, zod and js-sha3. Passing locally proves
      # nothing about a clean runner - this step is why agent-tools-api went red once.
      - name: agent-guards core
        run: npm install --no-audit --no-fund && node test/run.cjs
        working-directory: agent-guards
      # Proves a generated facade really starts and talks MCP to a real client. One facade is enough:
      # all six come from the same template in scripts/sync-shared.js and differ only in which
      # product's tools they select, and facades.mjs (in the step above) asserts that selection for
      # all six. Needs its own npm install for the SDK.
      - name: facade end to end
        run: npm install --no-audit --no-fund && node ../agent-guards/test/facade-client.mjs
        working-directory: agent-firewall-mcp
      - name: code-guard
        run: node test/local.cjs
        working-directory: code-guard
      - name: email-guard
        run: node test/local.cjs
        working-directory: email-guard
      - name: payment-guard
        run: npm install --no-audit --no-fund && node test/local.cjs
        working-directory: payment-guard
      - name: package-guard
        run: node test/local-pkg.cjs
        working-directory: package-guard
      - name: agent-firewall
        run: node test/local-firewall.cjs
        working-directory: agent-firewall
      # test/local-intel.cjs is deliberately not run here: it asserts against live third-party SSL,
      # RDAP and HTTP endpoints and fails intermittently through no fault of ours. A suite that goes
      # red at random teaches everyone to ignore red. Run it by hand when touching those endpoints.
      # Needs npm install for cheerio (api/extract.js), same as payment-guard needs js-sha3.
      - name: agent-tools-api
        run: npm install --no-audit --no-fund && node test/local.cjs && node test/local-read.cjs
        working-directory: agent-tools-api
